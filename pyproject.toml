[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "private-client-graph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
