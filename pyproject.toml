[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "private-client-graph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1,<2",
  "langchain-deepseek>=1.1,<2",
  "python-dotenv>=1,<2",
  "pydantic>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "authlib>=1.8,<2",
  "itsdangerous>=2.2,<3",
  "starlette-csrf>=3,<4",
  "httpx2>=2.13,<3",
  "joserfc>=1.7,<2",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1,<2",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
