name: Practitioner Next

on:
  pull_request:
    paths:
      - "practitioner-next/**"
      - ".github/workflows/practitioner-next.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practitioner_next:
    name: practitioner-next
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcg
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: pcg_next
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pcg -d pcg_next"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pcg:local-only@127.0.0.1:5432/pcg_next
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: practitioner-next/package-lock.json
      - run: npm ci --prefix practitioner-next
      - name: Validate the independent frontend
        working-directory: practitioner-next
        run: |
          npm run typecheck
          npm test
          npm run build
          npx prettier --check src e2e tests *.ts *.json *.html
      - name: Prepare disposable synthetic backend
        run: |
          uv run alembic upgrade head
          uv run python -m private_client_graph.persistence.seeds.evergreen
      - run: npx playwright install --with-deps chromium
        working-directory: practitioner-next
      - run: npm run test:e2e
        working-directory: practitioner-next
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practitioner-next-browser-evidence
          path: |
            practitioner-next/artifacts/*.png
            practitioner-next/test-results/
