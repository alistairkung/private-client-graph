name: Tests

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcg
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pcg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcg -d pcg_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pcg:test-only@127.0.0.1:5432/pcg_e2e
      DATABASE_URL: postgresql://pcg:test-only@127.0.0.1:5432/pcg_e2e
      PCG_GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
      PCG_GOOGLE_CLIENT_SECRET: test-google-secret
      PCG_SESSION_SECRET: test-session-secret-with-at-least-32-characters
      PCG_GOOGLE_SUB_ALLOWLIST: test-subject
      PCG_TRUSTED_ORIGIN: https://127.0.0.1:8000
      PCG_PROPOSAL_ANALYSIS_LIMIT: 100
      PCG_PROPOSAL_ANALYSIS_WINDOW_SECONDS: 86400
      DEEPSEEK_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install locked environment
        run: uv sync --locked
      - name: Install PostgreSQL 16 recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: uv run pytest --durations=25
      - name: Check application types
        run: uv run mypy private_client_graph/application private_client_graph/api private_client_graph/persistence private_client_graph/research private_client_graph/pipeline private_client_graph/extraction private_client_graph/resolution.py private_client_graph/extract.py private_client_graph/workbench --follow-imports=silent

  browser_e2e:
    name: browser-e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: application
            config: playwright.config.ts
          - suite: research-history
            config: playwright.research.config.ts
          - suite: research-execution
            config: playwright.execution.config.ts
          - suite: research-substituted-live
            config: playwright.live.config.ts
    # Each matrix job owns its runner, PostgreSQL service and temporary test state.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcg
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pcg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcg -d pcg_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pcg:test-only@127.0.0.1:5432/pcg_e2e
      PCG_GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
      PCG_GOOGLE_CLIENT_SECRET: test-google-secret
      PCG_SESSION_SECRET: test-session-secret-with-at-least-32-characters
      PCG_GOOGLE_SUB_ALLOWLIST: test-subject
      PCG_TRUSTED_ORIGIN: https://127.0.0.1:8000
      PCG_PROPOSAL_ANALYSIS_LIMIT: 100
      PCG_PROPOSAL_ANALYSIS_WINDOW_SECONDS: 86400
      DEEPSEEK_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install locked environment
        run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Test and build web application
        working-directory: web
        run: |
          npm test
          npm run build
          npm run test:research
          npm run build:research
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Initialize browser-test PostgreSQL database
        run: |
          uv run alembic upgrade head
          uv run python -m private_client_graph.persistence.seeds.evergreen
      - name: Test ${{ matrix.suite }} journey
        working-directory: web
        env:
          PLAYWRIGHT_CONFIG: ${{ matrix.config }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: npx playwright test --config "$PLAYWRIGHT_CONFIG" --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.suite }}
          path: |
            web/test-results/
            web/playwright-results.json

  docker_smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcg
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pcg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcg -d pcg_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pcg:test-only@127.0.0.1:5432/pcg_e2e
      PCG_GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
      PCG_GOOGLE_CLIENT_SECRET: test-google-secret
      PCG_SESSION_SECRET: test-session-secret-with-at-least-32-characters
      PCG_GOOGLE_SUB_ALLOWLIST: test-subject
      PCG_TRUSTED_ORIGIN: https://127.0.0.1:8000
      PCG_PROPOSAL_ANALYSIS_LIMIT: 100
      PCG_PROPOSAL_ANALYSIS_WINDOW_SECONDS: 86400
      DEEPSEEK_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - name: Verify research Compose restart and index rebuild
        run: python tests/research_compose_smoke.py
      - name: Build and smoke-test deployment image
        run: |
          docker build -t pcg-test .
          docker exec "${{ job.services.postgres.id }}" createdb -U pcg pcg_image
          export DATABASE_URL='postgresql://pcg:test-only@127.0.0.1:5432/pcg_image'
          docker run --rm --network host -e DATABASE_URL pcg-test sh -c 'alembic upgrade head && python -m private_client_graph.persistence.seeds.evergreen'
          docker run --rm --network host -e DATABASE_URL pcg-test sh -c 'alembic upgrade head && python -m private_client_graph.persistence.seeds.evergreen'
          docker run --rm -d --name pcg-app --network host -e DATABASE_URL \
            -e PCG_GOOGLE_CLIENT_ID -e PCG_GOOGLE_CLIENT_SECRET -e PCG_SESSION_SECRET \
            -e PCG_GOOGLE_SUB_ALLOWLIST -e PCG_TRUSTED_ORIGIN \
            -e PCG_PROPOSAL_ANALYSIS_LIMIT -e PCG_PROPOSAL_ANALYSIS_WINDOW_SECONDS \
            -e DEEPSEEK_API_KEY pcg-test
          trap 'docker logs pcg-app; docker stop pcg-app' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/matters)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/app)" = 200
          curl --fail http://127.0.0.1:8000/api/showcase/cases > /dev/null

  tests:
    name: tests
    if: always()
    needs: [python, browser_e2e, docker_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify all required test jobs passed
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser_e2e.result }}
          DOCKER_SMOKE_RESULT: ${{ needs.docker_smoke.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$BROWSER_E2E_RESULT" = success
          test "$DOCKER_SMOKE_RESULT" = success
