name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcg
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pcg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcg -d pcg_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pcg:test-only@127.0.0.1:5432/pcg_e2e
      DATABASE_URL: postgresql://pcg:test-only@127.0.0.1:5432/pcg_e2e
      PCG_GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
      PCG_GOOGLE_CLIENT_SECRET: test-google-secret
      PCG_SESSION_SECRET: test-session-secret-with-at-least-32-characters
      PCG_GOOGLE_SUB_ALLOWLIST: test-subject
      PCG_TRUSTED_ORIGIN: https://127.0.0.1:8000
      PCG_PROPOSAL_ANALYSIS_LIMIT: 100
      PCG_PROPOSAL_ANALYSIS_WINDOW_SECONDS: 86400
      DEEPSEEK_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install locked environment
        run: uv sync --locked
      - name: Install PostgreSQL 16 recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: uv run pytest
      - name: Check application types
        run: uv run mypy private_client_graph/application private_client_graph/api private_client_graph/persistence --follow-imports=silent
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Test and build web application
        working-directory: web
        run: |
          npm test
          npm run build
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Initialize browser-test PostgreSQL database
        run: |
          uv run alembic upgrade head
          uv run python -m private_client_graph.persistence.seeds.evergreen
      - name: Test professional-review journey
        working-directory: web
        run: npm run test:e2e
      - name: Build and smoke-test deployment image
        run: |
          docker build -t pcg-test .
          docker exec "${{ job.services.postgres.id }}" createdb -U pcg pcg_image
          export DATABASE_URL='postgresql://pcg:test-only@127.0.0.1:5432/pcg_image'
          docker run --rm --network host -e DATABASE_URL pcg-test sh -c 'alembic upgrade head && python -m private_client_graph.persistence.seeds.evergreen'
          docker run --rm --network host -e DATABASE_URL pcg-test sh -c 'alembic upgrade head && python -m private_client_graph.persistence.seeds.evergreen'
          docker run --rm -d --name pcg-app --network host -e DATABASE_URL \
            -e PCG_GOOGLE_CLIENT_ID -e PCG_GOOGLE_CLIENT_SECRET -e PCG_SESSION_SECRET \
            -e PCG_GOOGLE_SUB_ALLOWLIST -e PCG_TRUSTED_ORIGIN \
            -e PCG_PROPOSAL_ANALYSIS_LIMIT -e PCG_PROPOSAL_ANALYSIS_WINDOW_SECONDS \
            -e DEEPSEEK_API_KEY pcg-test
          trap 'docker logs pcg-app; docker stop pcg-app' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/matters)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/app)" = 303
          curl --fail http://127.0.0.1:8000/api/showcase/case-01 > /dev/null
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
